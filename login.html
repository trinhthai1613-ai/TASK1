<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – Management System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #dde8f5 0%, #eaf0fb 60%, #c8d8ee 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .logo-circle {
      width: 56px;
      height: 56px;
      background-color: #6c5ce7;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 auto 14px;
    }

    .welcome-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 4px;
    }

    .welcome-sub {
      color: #6b7280;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .login-card {
      background: white;
      border-radius: 14px;
      padding: 32px 36px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    .login-card h2 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 4px;
    }

    .login-card .sub {
      font-size: 0.82rem;
      color: #6b7280;
      margin-bottom: 22px;
    }

    .form-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #374151;
    }

    .form-control {
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.9rem;
      padding: 10px 14px;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: #6c5ce7;
      box-shadow: 0 0 0 3px rgba(108,92,231,0.15);
    }

    .input-group .form-control { border-right: none; }
    .input-group .btn-show {
      border: 1.5px solid #d1d5db;
      border-left: none;
      border-radius: 0 8px 8px 0;
      background: white;
      color: #6c5ce7;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .btn-login {
      background-color: #6c5ce7;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      width: 100%;
      transition: background 0.2s;
    }
    .btn-login:hover { background-color: #5a4bd1; }

    .form-check-label { font-size: 0.85rem; color: #374151; }
    .create-link { font-size: 0.85rem; color: #6b7280; text-align: center; margin-top: 16px; }
    .create-link a { color: #6c5ce7; font-weight: 600; text-decoration: none; }
    .create-link a:hover { text-decoration: underline; }

    footer { margin-top: 28px; font-size: 0.78rem; color: #9ca3af; }

    .alert-error {
      font-size: 0.85rem;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="logo-circle">M</div>
  <h1 class="welcome-title">Welcome Back!</h1>
  <p class="welcome-sub">Sign in to continue to your account.</p>

  <div class="login-card">
    <h2>Login to your account</h2>
    <p class="sub">Enter your email and password to get started.</p>

    <div id="errorMsg" class="alert alert-danger alert-error d-none">
      Incorrect email or password. Please try again.
    </div>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" class="form-control" id="email" placeholder="Enter your email" autocomplete="email" required/>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
          <input type="password" class="form-control" id="password" placeholder="Enter your password" autocomplete="current-password" required/>
          <button class="btn-show" type="button" id="togglePass">Show</button>
        </div>
      </div>
      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" id="rememberMe"/>
        <label class="form-check-label" for="rememberMe">Remember me</label>
      </div>
      <button type="submit" class="btn btn-primary btn-login">Login</button>
    </form>

    <p class="create-link">Don't have an account? <a href="#">Create an account</a></p>
  </div>

  <footer>&copy; My Website. All rights reserved.</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Hardcoded accounts
    const ACCOUNTS = [
      { email: 'admin@gmail.com',   password: 'admin123' },
      { email: 'student@gmail.com', password: '123456'   },
      { email: 'hana@gmail.com',    password: 'hana123'  }
    ];

    if (sessionStorage.getItem('ms_user')) window.location.href = 'home.html';

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const em = document.getElementById('email').value.trim();
      const pw = document.getElementById('password').value;
      const found = ACCOUNTS.find(a => a.email === em && a.password === pw);
      if (found) {
        sessionStorage.setItem('ms_user', JSON.stringify(found));
        window.location.href = 'home.html';
      } else {
        document.getElementById('errorMsg').classList.remove('d-none');
      }
    });

    document.getElementById('togglePass').addEventListener('click', function() {
      const pw = document.getElementById('password');
      if (pw.type === 'password') { pw.type = 'text'; this.textContent = 'Hide'; }
      else { pw.type = 'password'; this.textContent = 'Show'; }
    });
  </script>
</body>
</html>
