<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EduLearn – Đăng nhập</title>
  <meta name="description" content="Đăng nhập vào EduLearn – nền tảng học trực tuyến đơn giản và hiệu quả."/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <style>
    body {
      background-color: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      max-width: 420px;
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.10);
    }
    .login-header {
      background-color: #2563eb;
      color: white;
      border-radius: 12px 12px 0 0;
      padding: 28px 32px 20px;
      text-align: center;
    }
    .login-header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .login-header p {
      font-size: 0.9rem;
      opacity: 0.85;
      margin: 0;
    }
    .login-body {
      background: white;
      padding: 28px 32px 32px;
      border-radius: 0 0 12px 12px;
    }
    .btn-login {
      background-color: #2563eb;
      border: none;
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      font-weight: 600;
    }
    .btn-login:hover {
      background-color: #1d4ed8;
    }
    .hint-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.82rem;
      color: #1e40af;
    }
    .alert-danger-custom {
      font-size: 0.88rem;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <h1><i class="bi bi-mortarboard-fill me-2"></i>EduLearn</h1>
      <p>Nền tảng học trực tuyến</p>
    </div>
    <div class="login-body">
      <div id="errorMsg" class="alert alert-danger alert-danger-custom d-none" role="alert">
        <i class="bi bi-exclamation-triangle me-1"></i> Sai tên đăng nhập hoặc mật khẩu!
      </div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="username" class="form-label fw-semibold">Tên đăng nhập</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" id="username" placeholder="Nhập tên đăng nhập" autocomplete="username" required/>
          </div>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label fw-semibold">Mật khẩu</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu" autocomplete="current-password" required/>
            <button class="btn btn-outline-secondary" type="button" id="togglePass" tabindex="-1">
              <i class="bi bi-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-login">
          <i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập
        </button>
      </form>

      <div class="hint-box mt-4">
        <strong><i class="bi bi-info-circle me-1"></i>Tài khoản thử:</strong><br/>
        👤 <code>admin</code> / 🔑 <code>admin123</code><br/>
        👤 <code>student</code> / 🔑 <code>123456</code>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Tài khoản hardcode
    const ACCOUNTS = [
      { username: 'admin',   password: 'admin123', role: 'Giáo viên', name: 'Nguyễn Quản Trị' },
      { username: 'student', password: '123456',   role: 'Học sinh',  name: 'Trần Văn Học'   }
    ];

    // Nếu đã đăng nhập thì chuyển thẳng sang home
    if (sessionStorage.getItem('edulearn_user')) {
      window.location.href = 'home.html';
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const un = document.getElementById('username').value.trim();
      const pw = document.getElementById('password').value;
      const found = ACCOUNTS.find(a => a.username === un && a.password === pw);
      if (found) {
        sessionStorage.setItem('edulearn_user', JSON.stringify(found));
        window.location.href = 'home.html';
      } else {
        document.getElementById('errorMsg').classList.remove('d-none');
      }
    });

    // Toggle show/hide password
    document.getElementById('togglePass').addEventListener('click', function() {
      const pw = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (pw.type === 'password') {
        pw.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        pw.type = 'password';
        icon.className = 'bi bi-eye';
      }
    });
  </script>
</body>
</html>
