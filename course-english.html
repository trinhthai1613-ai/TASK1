  </style>
</head>

<script>

  const LESSONS = [
    {
      title: 'Bài 1: Chào hỏi & Giới thiệu',

        <p>Bài học đầu tiên giúp bạn làm quen với các cụm từ chào hỏi và tự giới thiệu bản thân trong tiếng Anh.</p>
        <h6 class="fw-bold mt-3">Từ vựng cơ bản:</h6>

          <thead class="table-success"><tr><th>Tiếng Anh</th><th>Phát âm</th><th>Nghĩa</th></tr></thead>

        <pre>A: Hi! My name is Lan. What's your name?
B: Hello, Lan! I'm Minh. Nice to meet you.
A: Nice to meet you too! How are you?

    },
    {
      title: 'Bài 2: Số đếm & Ngày tháng',
      content: `
        <h2 class="lesson-title mb-3"><i class="bi bi-123 text-success me-2"></i>Số đếm & Ngày tháng</h2>
        <p>Học cách đọc số và ngày tháng trong tiếng Anh – kỹ năng cần thiết trong giao tiếp hàng ngày.</p>
        <h6 class="fw-bold mt-3">Số đếm 1–20:</h6>
        <div class="row g-1">
          <div class="col-6">

              <li>1 – One &nbsp; 2 – Two &nbsp; 3 – Three</li>

              <li>7 – Seven &nbsp; 8 – Eight &nbsp; 9 – Nine</li>
              <li>10 – Ten</li>
            </ul>
          </div>
          <div class="col-6">
            <ul class="list-unstyled small">
              <li>11 – Eleven &nbsp; 12 – Twelve</li>
              <li>13 – Thirteen &nbsp; 14 – Fourteen</li>
              <li>15 – Fifteen &nbsp; 20 – Twenty</li>

          </div>
        </div>
        <h6 class="fw-bold mt-3">Các tháng trong năm:</h6>

April (4)   – May (5)      – June (6)
July (7)    – August (8)   – September (9)
October (10)– November (11)– December (12)</pre>
        <h6 class="fw-bold mt-3">Hỏi về ngày tháng:</h6>
        <pre>Q: What's today's date?
A: Today is October 13th, 2024.

Q: What day is it today?
A: It's Monday.</pre>`
    },
    {
      title: 'Bài 3: Gia đình & Người thân',
      content: `
        <h2 class="lesson-title mb-3"><i class="bi bi-people text-success me-2"></i>Gia đình & Người thân</h2>
        <p>Học từ vựng để mô tả các thành viên trong gia đình và nói chuyện về gia đình mình bằng tiếng Anh.</p>
        <h6 class="fw-bold mt-3">Từ vựng gia đình:</h6>
        <table class="table table-bordered vocab-table">
          <thead class="table-success"><tr><th>Tiếng Anh</th><th>Nghĩa</th></tr></thead>
          <tbody>
            <tr><td>Father / Dad</td><td>Bố / Ba</td></tr>

            <tr><td>Brother</td><td>Anh / em trai</td></tr>
            <tr><td>Sister</td><td>Chị / em gái</td></tr>
            <tr><td>Grandfather</td><td>Ông</td></tr>
            <tr><td>Grandmother</td><td>Bà</td></tr>
          </tbody>
        </table>
        <h6 class="fw-bold mt-3">Mẫu câu giới thiệu gia đình:</h6>
        <pre>My family has four members.
I have a father, a mother, and a sister.
My father is a doctor. My mother is a teacher.
My sister is 15 years old. She is a student.</pre>`
    },
    {
      title: 'Bài 4: Hỏi đường & Chỉ đường',
      content: `
        <h2 class="lesson-title mb-3"><i class="bi bi-signpost text-success me-2"></i>Hỏi đường & Chỉ đường</h2>
        <p>Kỹ năng quan trọng khi đi du lịch hoặc làm việc ở môi trường quốc tế.</p>
        <h6 class="fw-bold mt-3">Các cụm từ hỏi đường:</h6>
        <ul>
          <li>Excuse me, where is the...? – Xin lỗi, ... ở đâu?</li>
          <li>How can I get to...? – Tôi có thể đến ... bằng cách nào?</li>
          <li>Is it far from here? – Nó có xa không?</li>

        <h6 class="fw-bold mt-3">Từ vựng chỉ đường:</h6>
        <pre>Turn left     – Rẽ trái
Turn right    – Rẽ phải
Go straight   – Đi thẳng
Cross the road– Qua đường
At the corner – Ở góc đường
Next to       – Bên cạnh</pre>
        <h6 class="fw-bold mt-3">Hội thoại:</h6>
        <pre>A: Excuse me, where is the post office?
B: Go straight, then turn left at the traffic light.
   It's next to the supermarket.
A: How far is it?
B: About 500 meters. You can walk there.</pre>`
    },
    {
      title: 'Bài 5: Mua sắm & Giá cả',
      content: `
        <h2 class="lesson-title mb-3"><i class="bi bi-cart text-success me-2"></i>Mua sắm & Giá cả</h2>
        <p>Học cách hỏi giá, mặc cả và thanh toán bằng tiếng Anh khi mua sắm.</p>
        <h6 class="fw-bold mt-3">Từ vựng mua sắm:</h6>
        <table class="table table-bordered vocab-table">
          <thead class="table-success"><tr><th>Tiếng Anh</th><th>Nghĩa</th></tr></thead>
          <tbody>
            <tr><td>How much is this?</td><td>Cái này giá bao nhiêu?</td></tr>
            <tr><td>It costs...</td><td>Nó có giá...</td></tr>
            <tr><td>Can I have a discount?</td><td>Tôi có được giảm giá không?</td></tr>
            <tr><td>I'll take it</td><td>Tôi sẽ mua nó</td></tr>
            <tr><td>Do you have a smaller size?</td><td>Bạn có size nhỏ hơn không?</td></tr>
          </tbody>
        </table>
        <h6 class="fw-bold mt-3">Hội thoại tại cửa hàng:</h6>
        <pre>Customer: How much is this shirt?
Seller   : It's $25.
Customer : Can I have a discount?
Seller   : Sorry, the price is fixed. But you get 
           a free bag if you spend over $50.
Customer : Okay, I'll take two shirts then.</pre>`
    },
    {
      title: 'Bài 6: Thời tiết & Mùa',
      content: `
        <h2 class="lesson-title mb-3"><i class="bi bi-cloud-sun text-success me-2"></i>Thời tiết & Mùa</h2>
        <p>Từ vựng và mẫu câu về thời tiết – chủ đề phổ biến nhất khi bắt chuyện với người nước ngoài.</p>
        <h6 class="fw-bold mt-3">Từ vựng thời tiết:</h6>
        <pre>Sunny   – Nắng      | Rainy  – Mưa
Cloudy  – Nhiều mây | Windy  – Gió
Hot     – Nóng      | Cold   – Lạnh
Humid   – Ẩm ướt   | Storm  – Bão
Snow    – Tuyết     | Foggy  – Sương mù</pre>
        <h6 class="fw-bold mt-3">Bốn mùa:</h6>
        <ul>
          <li>🌸 <strong>Spring</strong> – Mùa xuân (March–May)</li>
          <li>☀️ <strong>Summer</strong> – Mùa hè (June–August)</li>
          <li>🍂 <strong>Autumn/Fall</strong> – Mùa thu (September–November)</li>
          <li>❄️ <strong>Winter</strong> – Mùa đông (December–February)</li>
        </ul>
        <h6 class="fw-bold mt-3">Mẫu câu:</h6>
        <pre>What's the weather like today?
– It's sunny and hot today.
– The temperature is about 35 degrees Celsius.
– I think it will rain this afternoon.</pre>`
    },
    {
      title: 'Bài 7: Ăn uống & Nhà hàng',
      content: `
        <h2 class="lesson-title mb-3"><i class="bi bi-cup-hot text-success me-2"></i>Ăn uống & Nhà hàng</h2>
        <p>Kỹ năng gọi món, hỏi về menu và thanh toán tại nhà hàng bằng tiếng Anh.</p>
        <h6 class="fw-bold mt-3">Từ vựng đồ ăn thức uống:</h6>
        <pre>Rice – Cơm        | Noodles – Mì/Bún
Bread – Bánh mì   | Fish – Cá
Chicken – Gà      | Vegetables – Rau củ
Water – Nước      | Juice – Nước ép
Coffee – Cà phê   | Tea – Trà</pre>
        <h6 class="fw-bold mt-3">Gọi món tại nhà hàng:</h6>
        <pre>Waiter : Are you ready to order?
Customer: Yes. I'd like a bowl of pho, please.
Waiter : Would you like anything to drink?
Customer: A glass of iced tea, please.
Waiter : Of course. Anything else?
Customer: No, that's all. Thank you.
...
Customer: Could I have the bill, please?</pre>`
    },
    {
      title: 'Bài 8: Công việc & Nghề nghiệp',
      content: `
        <h2 class="lesson-title mb-3"><i class="bi bi-briefcase text-success me-2"></i>Công việc & Nghề nghiệp</h2>
        <p>Học từ vựng về nghề nghiệp và cách mô tả công việc bằng tiếng Anh.</p>
        <h6 class="fw-bold mt-3">Nghề nghiệp phổ biến:</h6>
        <table class="table table-bordered vocab-table">
          <thead class="table-success"><tr><th>Tiếng Anh</th><th>Nghĩa</th></tr></thead>
          <tbody>
            <tr><td>Teacher</td><td>Giáo viên</td></tr>
            <tr><td>Doctor / Nurse</td><td>Bác sĩ / Y tá</td></tr>
            <tr><td>Engineer</td><td>Kỹ sư</td></tr>
            <tr><td>Software Developer</td><td>Lập trình viên</td></tr>
            <tr><td>Accountant</td><td>Kế toán</td></tr>
            <tr><td>Designer</td><td>Nhà thiết kế</td></tr>
          </tbody>
        </table>
        <h6 class="fw-bold mt-3">Mẫu câu về công việc:</h6>
        <pre>What do you do for a living?
– I'm a software developer.
– I work at a technology company.
– I've been working there for 3 years.

What does your job involve?
– I design websites and mobile apps.</pre>`
    },
    {
      title: 'Bài 9: Du lịch & Khách sạn',
      content: `
        <h2 class="lesson-title mb-3"><i class="bi bi-airplane text-success me-2"></i>Du lịch & Khách sạn</h2>
        <p>Từ vựng và hội thoại cần thiết khi đi du lịch nước ngoài.</p>
        <h6 class="fw-bold mt-3">Tại sân bay:</h6>
        <pre>Where is the check-in counter?
– Quầy check-in ở đâu?

I'd like a window seat, please.
– Tôi muốn chỗ ngồi cạnh cửa sổ.

My baggage is lost.
– Hành lý của tôi bị thất lạc.</pre>
        <h6 class="fw-bold mt-3">Tại khách sạn:</h6>
        <pre>Receptionist: Good evening. How can I help you?
Guest       : I have a reservation under the name Minh.
Receptionist: Let me check... Yes, room 305.
              Here is your key card.
Guest       : Thank you. What time is breakfast?
Receptionist: From 7 to 10 AM in the restaurant.</pre>
        <h6 class="fw-bold mt-3">Từ vựng hữu ích:</h6>
        <ul>
          <li>Passport – Hộ chiếu</li>
          <li>Visa – Thị thực</li>
          <li>Boarding pass – Thẻ lên máy bay</li>
          <li>Luggage / Baggage – Hành lý</li>
        </ul>`
    },
    {
      title: 'Bài 10: Phỏng vấn xin việc',
      content: `
        <h2 class="lesson-title mb-3"><i class="bi bi-trophy text-warning me-2"></i>Phỏng vấn xin việc</h2>
        <p>Chuẩn bị những câu hỏi và trả lời thông dụng trong buổi phỏng vấn xin việc bằng tiếng Anh.</p>
        <h6 class="fw-bold mt-3">Câu hỏi phỏng vấn phổ biến:</h6>
        <pre>1. Tell me about yourself.
   → My name is Lan. I graduated from...

2. Why do you want this job?
   → I'm passionate about... and believe I can...

3. What are your strengths?
   → I'm a quick learner and a team player.

4. Where do you see yourself in 5 years?
   → I hope to grow into a senior role...

5. Do you have any questions for us?
   → Yes, could you tell me about the team culture?</pre>
        <div class="alert alert-success mt-3">
          <i class="bi bi-award-fill me-2"></i><strong>Chúc mừng! Bạn đã hoàn thành khóa học Tiếng Anh Giao tiếp!</strong>
          Hãy luyện tập hàng ngày để giao tiếp tự tin hơn!
        </div>`
    }
  ];

  const STORAGE_KEY = 'edulearn_english_progress';
  let completed = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let currentIdx = 0;

  function renderSidebar() {
    const list = document.getElementById('lessonList');
    list.innerHTML = '';
    LESSONS.forEach((l, i) => {
      const done = completed.includes(i);
      const active = i === currentIdx;
      const item = document.createElement('a');
      item.href = '#';
      item.className = 'list-group-item list-group-item-action py-2 px-3 small' + (active ? ' active' : '');
      item.innerHTML = `<i class="bi ${done ? 'bi-check-circle-fill text-success' : 'bi-circle'} me-2"></i>${l.title}`;
      item.addEventListener('click', function(e) { e.preventDefault(); loadLesson(i); });
      list.appendChild(item);
    });
    updateProgress();
  }

  function renderContent(idx) {
    const done = completed.includes(idx);
    document.getElementById('lessonContent').innerHTML = LESSONS[idx].content + `
      <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top flex-wrap gap-2">
        <button class="btn btn-outline-secondary btn-sm" id="prevBtn" ${idx === 0 ? 'disabled' : ''}>
          <i class="bi bi-arrow-left me-1"></i>Bài trước
        </button>
        <button class="btn ${done ? 'btn-success' : 'btn-success'} btn-sm" id="doneBtn">
          <i class="bi ${done ? 'bi-check-lg' : 'bi-check2'} me-1"></i>${done ? 'Đã hoàn thành' : 'Đánh dấu hoàn thành'}
        </button>
        <button class="btn btn-outline-secondary btn-sm" id="nextBtn" ${idx === LESSONS.length - 1 ? 'disabled' : ''}>
          Bài tiếp<i class="bi bi-arrow-right ms-1"></i>
        </button>
      </div>`;
    document.getElementById('prevBtn').addEventListener('click', () => loadLesson(idx - 1));
    document.getElementById('nextBtn').addEventListener('click', () => loadLesson(idx + 1));
    document.getElementById('doneBtn').addEventListener('click', () => markDone(idx));
  }

  function loadLesson(idx) {
    currentIdx = idx;
    renderSidebar();
    renderContent(idx);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function markDone(idx) {
    if (!completed.includes(idx)) {
      completed.push(idx);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(completed));
    }
    renderSidebar();
    renderContent(idx);
  }

  function updateProgress() {
    const pct = Math.round(completed.length / LESSONS.length * 100);
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressText').textContent = completed.length + ' / ' + LESSONS.length + ' bài';
  }

  loadLesson(0);
</script>
</body>
</html>
